[metadata]
name = web_interface
version = 0.1.0
author = Unitree Go2 Team
author_email = example@example.com
license = MIT

[options]
packages = find:
install_requires =
    Flask>=2.3
    Flask-Cors>=4.0
    Pillow>=9.0
    PyYAML>=6.0
zip_safe = False
include_package_data = True

[options.package_data]
web_interface = web/*.html, web/*.js, web/*.css, maps/*.pgm, maps/*.yaml, maps/*.png, maps/*.jpg, maps/*.jpeg, maps/*/*.pgm, maps/*/*.yaml, maps/*/*.png, maps/*/*.jpg, maps/*/*.jpeg, object_list/*.yaml

[options.entry_points]
console_scripts =
    web_interface_server = web_interface.ros2_bridge:main

[options.data_files]
share/ament_index/resource_index/packages =
    resource/web_interface
share/web_interface =
    package.xml

[develop]
script_dir=$base/lib/web_interface
[install]
install_scripts=$base/lib/web_interface
