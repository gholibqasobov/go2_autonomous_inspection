<!DOCTYPE html>
<html>
<head>
    <title>Damaged Objects Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            color: white;
            padding: 10px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        .back-button {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px;
        }
        .item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .item img {
            max-width: 300px;
            border-radius: 8px;
        }
        .name {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Damaged Objects</h1>
        <a href="/" class="back-button">← Back</a>
    </header>
    <div class="gallery">
    {% for name, image in images.items() %}
    <div class="item">
        <img src="{{ url_for('image', filename=image) }}" alt="{{ name }}">
        <div class="name">{{ name }}</div>
    </div>
    {% endfor %}
    </div>

</body>
</html>
